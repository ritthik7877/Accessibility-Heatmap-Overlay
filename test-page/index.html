<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessibility heatmap demo page</title>
    <style>
      body { max-width: 760px; margin: 3rem auto; padding: 0 1.5rem; font: 16px/1.5 Arial, sans-serif; color: #aaa; }
      .hero { display: flex; gap: 1.5rem; align-items: center; }
      img { width: 220px; height: 140px; object-fit: cover; }
      .faint { color: #bbb; }
      .tiny { width: 18px; height: 18px; padding: 0; }
      .no-focus:focus { outline: none; }
    </style>
  </head>
  <body>
    <h1>Sample accessibility test page</h1>
    <h3>Skipped heading level</h3>
    <h1>Second level-one heading</h1>
    <section class="hero">
      <img src="https://placehold.co/440x280" alt="">
      <p class="faint">This paragraph has low contrast against the page background.</p>
    </section>
      <h3>Other checks</h3>
      <form><label for="named-field">Labeled control</label><input id="named-field"><input type="text"></form>
      <button class="tiny no-focus" tabindex="2"></button>
      <a href="#details"></a>
      <p id="details">Scan this page to see contrast, image text, label, name, heading, target, language, and focus findings.</p>
  </body>
</html>
